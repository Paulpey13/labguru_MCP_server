[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "labguru-mcp"
version = "1.0.0"
description = "Model Context Protocol server for the Labguru laboratory management API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Paul Peyssard" },
    { name = "Neuro-Sys" },
]
keywords = ["labguru", "mcp", "model-context-protocol", "eln", "lims", "laboratory"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/neuro-sys/labguru-mcp"
Repository = "https://github.com/neuro-sys/labguru-mcp"

[project.scripts]
labguru-mcp = "labguru_mcp.app:main"

[tool.hatch.build.targets.wheel]
packages = ["labguru_mcp"]
